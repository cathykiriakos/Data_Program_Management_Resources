# Registry row schema for one agent.
#
# One row per agent, kept in registry_row.yaml beside the agent's charter. A folder
# that holds several agents may use registry.yaml instead, with one entry per agent
# keyed by agent_id. The agent linter reads the row and compares it with the charter.
#
# A charter is a prompt. The row is where the enforced facts live. Three fields are
# mirrored on purpose: write tools with their scopes, data classes, and approval
# gates. They appear in both the charter and the row, and the linter reports any
# difference as an error. The spend cap and the model pin appear only here, and the
# charter points to them, so they are edited in one place.
#
# Field table
#
#   Field                 Required  Mirrored in charter  Meaning
#   agent_id              yes       yes (same value)     Stable id, also the key in registry.yaml
#   tier                  yes       yes (same value)     T1 to T4, from the addendum risk tiers
#   tools                 yes       write tools only     List of name, scope, access (read or write)
#   data_classes          yes       yes                  Data classes the agent may touch
#   approval_gates        yes       yes                  Gates that hold an action for a named person
#   spend_cap_usd_month   yes       no (referenced)      Monthly spend cap, enforced by the provider budget
#   model                 yes       no (referenced)      provider, id, pinned_version, family
#   model.family          yes       no                   Model family, used to keep assessors independent
#   enforcement           yes       no                   Map of bound name to the control that enforces it
#   status                yes       no                   proposed, active, suspended, or retired
#   last_assessed         no        no                   Date of the last assessor or second-person review
#
# Notes
#
#   - access is read or write. Anything that sends, posts, edits, deletes, or pays
#     is write, even when the tool name sounds harmless.
#   - approval_gates may be an empty list only for a T4 agent with no external writes.
#   - enforcement keys should match the names in the charter's enforcement_refs.
#     Each value says where the control lives: an identity provider scope, a sandbox
#     profile, a proxy or egress rule, or a budget alert.
#   - family is the model lineage, not the vendor. Two products from one lineage share
#     a family, and an assessor must not share a family with the agent it reviews.

agent_id: donor-ack-001
tier: T3

# Tools and scopes. The write entries here must match the charter exactly.
tools:
  - {name: read_gift_records, scope: "crm:gifts:read", access: read}
  - {name: create_draft, scope: "mail:drafts:write", access: write}

# Mirrored with the charter.
data_classes: [donor_contact, gift_history]
approval_gates: [staff_review_before_send]

# Registry-only fields.
spend_cap_usd_month: 40
model:
  provider: provider_a
  id: model-a-large
  pinned_version: "2026-09-01"
  family: family_a

# Where each bound is enforced outside the model.
enforcement:
  idp_scope_mail_drafts_only: IdP scope allows drafts, not send
  runtime_budget_alert: provider budget alert at 80 percent of the cap

status: active
last_assessed: 2026-10-15
