agent_id: assessor-boundary-donor-001
tier: T3

identity:
  account_name: svc-assessor-boundary-donor-001
  credential_type: oauth_client_credentials
  max_token_lifetime_minutes: 30
tools:
  - {name: read_sampled_drafts, scope: "mail:drafts:read", access: read}
  - {name: read_audit_log, scope: "logs:agent_audit:read", access: read}
data_classes: [donor_contact, gift_history]
approval_gates: []
spend_cap_usd_month: 10
model:
  provider: provider_b
  id: model-b-medium
  pinned_version: "2026-08-15"
  family: family_b

model_review:
  provenance: hosted model from the provider's official API
  licence_terms: provider terms read and filed, use by the organization permitted
  data_handling: no training on inputs, retention 30 days, no provider staff access by default
  data_residency: provider region matches the organization's policy
  fit_for_data_classes: donor_contact and gift_history only, no regulated data
  vendor_agreement: not required, no regulated data
enforcement:
  idp_scope_drafts_read_only: IdP scope mail:drafts:read only, no other scope granted
  idp_scope_audit_log_read_only: IdP scope logs:agent_audit:read only, limited to the target agent's log entries, no other log scope granted
  findings_log_append_only: findings written by the runtime to an append-only log the assessor cannot edit
  runtime_budget_alert: provider budget limit at the cap, alert to the owner at 80 percent
  stateless_runtime_profile: runtime profile with no memory store and no network except the drafts folder and the log
status: active
last_assessed: 2026-11-04
