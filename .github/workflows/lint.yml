name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tools/tests
      - run: python tools/library_lint.py
      - run: python tools/agent_lint.py Agentic_AI_Standards/examples
        if: ${{ hashFiles('tools/agent_lint.py') != '' && hashFiles('Agentic_AI_Standards/examples/**') != '' }}
